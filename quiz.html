<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curadoria IA - Peak Fiction</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pf-red: #E50914; --pf-dark: #141414; --pf-dark-2: #1a1a1a; 
      --pf-dark-4: #2f2f2f; --pf-gray: #b3b3b3; --pf-white: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--pf-dark); color: var(--pf-white); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--pf-red); letter-spacing: 2px; margin-bottom: 40px; text-decoration: none; }
    
    .quiz-container { background: var(--pf-dark-2); border: 1px solid var(--pf-dark-4); border-radius: 12px; width: 100%; max-width: 650px; padding: 48px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
    
    .progress-bar { width: 100%; height: 6px; background: var(--pf-dark-4); border-radius: 4px; margin-bottom: 40px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--pf-red); width: 0%; transition: width 0.4s ease; }
    
    .question { font-family: 'Bebas Neue', sans-serif; font-size: 40px; margin-bottom: 32px; letter-spacing: 1px; line-height: 1.1; }
    .options { display: flex; flex-direction: column; gap: 14px; }
    .option-btn { background: transparent; border: 2px solid var(--pf-dark-4); color: var(--pf-gray); padding: 20px; border-radius: 8px; font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: left; }
    .option-btn:hover { border-color: var(--pf-red); color: var(--pf-white); background: rgba(229,9,20,0.1); transform: translateX(8px); }
    
    #loading { display: none; flex-direction: column; align-items: center; gap: 24px; padding: 40px 0; }
    .spinner { width: 60px; height: 60px; border: 4px solid var(--pf-dark-4); border-top-color: var(--pf-red); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #results { display: none; text-align: left; }
    .movie-card { display: flex; gap: 20px; background: var(--pf-dark); padding: 20px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid var(--pf-red); }
    .movie-info h3 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; margin-bottom: 8px; letter-spacing: 1px; }
    .movie-info p { font-size: 15px; color: var(--pf-gray); margin-bottom: 12px; line-height: 1.6; }
    .movie-tags { font-size: 12px; color: var(--pf-red); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; background: rgba(229,9,20,0.1); padding: 4px 8px; border-radius: 4px; }
    
    .btn-voltar { display: inline-block; margin-top: 32px; background: var(--pf-red); color: white; padding: 18px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; width: 100%; letter-spacing: 2px; transition: background 0.2s; }
    .btn-voltar:hover { background: #B20710; }
  </style>
</head>
<body>

  <a href="index.html" class="logo">PEAK FICTION</a>

  <div class="quiz-container" id="quiz-box">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    
    <div id="question-container">
      <h2 class="question" id="question-text">Carregando...</h2>
      <div class="options" id="options-container"></div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <h2 style="font-family: 'Bebas Neue'; font-size: 32px; letter-spacing: 1px;">A IA ESTÁ PROCESSANDO...</h2>
      <p style="color: var(--pf-gray); font-size: 16px;">Cruzando o seu perfil com a nossa base de dados.</p>
    </div>

    <div id="results">
      <h2 style="font-family: 'Bebas Neue'; font-size: 36px; text-align: center; margin-bottom: 32px; letter-spacing: 1px;">SEU ABSOLUTE CINEMA É:</h2>
      <div id="movies-list"></div>
      <a href="index.html" class="btn-voltar">VOLTAR PARA A LOJA</a>
    </div>
  </div>

  <script src="assets/js/banco-de-filmes.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        console.log("O Quiz foi iniciado com sucesso!"); // Se aparecer no console, o código rodou.

        const questions = [
      {
        question: "Como você está se sentindo hoje?",
        options: [
          { text: "Estou pensativo e quero uma história diferente, que me faça pensar bastante.", tag: "mindfuck" },
          { text: "Estou a fim de um filme cheio de suspense, algo que me mantenha acordado(a).", tag: "tenso" },
          { text: "Tive um dia cansativo... só quero dar boas risadas e relaxar.", tag: "rir" },
          { text: "Quero me emocionar de verdade com uma história bem tocante, estou afim de chorar.", tag: "chorar" }
        ]
      },
      {
        question: "Quanto tempo você reservou para a nosso filme?",
        options: [
          { text: "Quero algo mais curto e com ritmo acelerado hoje.", tag: "curto" },
          { text: "O tempo normal de um filme, em torno de duas horinhas.", tag: "padrao" },
          { text: "Estou com bastante tempo livre e adoro filmes longos ou épicos.", tag: "epic" }
        ]
      },
      {
        question: "Que estilo visual mais te agrada no cinema?",
        options: [
          { text: "Efeitos visuais bem modernos e uma fotografia impecável.", tag: "moderno" },
          { text: "Aquela nostalgia e o charme clássico dos anos 80 e 90.", tag: "anos90" },
          { text: "Um estilo mais artístico, muito focado no roteiro e bons diálogos.", tag: "cult" }
        ]
      },
      {
        question: "Para fechar: que tipo de universo você quer explorar?",
        options: [
          { text: "Quero viajar para mundos irreais, fantasia ou ficção científica.", tag: "scifi" },
          { text: "Prefiro histórias baseadas na realidade, dramas reais ou crimes.", tag: "real" }
        ]
      }
    ];

        let currentQ = 0;
        let userTags = [];

        const qText = document.getElementById('question-text');
        const optContainer = document.getElementById('options-container');
        const progress = document.getElementById('progress');
        const qContainer = document.getElementById('question-container');
        const loadBox = document.getElementById('loading');
        const resBox = document.getElementById('results');
        const movList = document.getElementById('movies-list');

        function renderQuestion() {
          if (currentQ >= questions.length) { calculateResults(); return; }
          
          const q = questions[currentQ];
          qText.textContent = q.question;
          optContainer.innerHTML = '';
          progress.style.width = ((currentQ / questions.length) * 100) + "%";

          q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            btn.onclick = () => {
              userTags.push(opt.tag);
              currentQ++;
              renderQuestion();
            };
            optContainer.appendChild(btn);
          });
        }

        function calculateResults() {
          qContainer.style.display = 'none';
          progress.style.width = '100%';
          loadBox.style.display = 'flex';

          if (typeof movieDatabase === 'undefined' || movieDatabase.length === 0) {
            setTimeout(() => {
              loadBox.style.display = 'none';
              resBox.style.display = 'block';
              movList.innerHTML = '<p style="text-align:center; color: var(--pf-gray);">Erro: O banco de dados (banco-de-filmes.js) está vazio ou não conectou.</p>';
            }, 2000);
            return;
          }

          movieDatabase.forEach(movie => {
            movie.score = 0;
            if(movie.tags) {
               movie.tags.forEach(t => { if (userTags.includes(t)) movie.score++; });
            }
          });

          const topMovies = movieDatabase.sort((a, b) => b.score - a.score).slice(0, 3);

          setTimeout(() => {
            loadBox.style.display = 'none';
            resBox.style.display = 'block';
            
            topMovies.forEach(m => {
              movList.innerHTML += `
                <div class="movie-card">
                  <div class="movie-info">
                    <h3>${m.title}</h3>
                    <p>${m.desc}</p>
                    <span class="movie-tags">${m.tags.join(' • ')}</span>
                  </div>
                </div>
              `;
            });
          }, 3000); 
        }

        // Dá o pontapé inicial
        renderQuestion();
    });
  </script>
</body>
</html>
